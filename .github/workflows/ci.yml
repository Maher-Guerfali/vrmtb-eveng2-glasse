name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: glass-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: glass-app/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Syntax-check the transcription server
        run: node --check tools/transcription-server.mjs
